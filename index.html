<style>
/* Layout: one-screen app — quiet header, a third-person 3D course fills the middle with a hole card, minimap and swing gauge floating on it, a caddie-board panel holds aim, club, swing, scorecard and feed */
:root{

}
html,body{height:100%}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1100px;margin:0 auto}

.right{display:flex;align-items:center;gap:10px}
.count{font-size:.85rem;color:var(--mist);white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:var(--sun);font-weight:400}
button.count{height:32px;padding:0 12px;cursor:pointer}
.people{position:absolute;left:10px;top:96px;width:min(280px,calc(100% - 120px));background:rgba(15,22,15,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:2}
.visits{margin:0 0 8px;padding-bottom:7px;border-bottom:1px dashed var(--line);font-size:.78rem;color:var(--mist);font-variant-numeric:tabular-nums}

.pill{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mist);font-family:var(--body);font-size:.8rem;height:32px;padding:0 12px;border-radius:16px;cursor:pointer;white-space:nowrap}

.gauge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--paper);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}

<div class="app" id="app">
  <header>
    <h1>멍냥 골프장<small>열여덟 홀 단풍 코스</small></h1>
    <div class="right">
      <button class="count pill" id="count" type="button" aria-expanded="false" aria-controls="people">코스에 <b>1</b>명</button>
      <button id="chr" class="pill" type="button" aria-haspopup="dialog">캐릭터</button>
      <button id="snd" class="pill" type="button" aria-pressed="false">소리 켜기</button>
    </div>

function scoreName(s,par){

  return d<=-3?"앨버트로스":d===-2?"이글":d===-1?"버디":d===0?"파":d===1?"보기":d===2?"더블 보기":d===3?"트리플 보기":`+${d}`;

function cardPlayers(){

  for(const p of peers){if(p.sameTab||!p.presence)continue;const pr=p.presence,c=Array.isArray(pr.c)?pr.c:[];
    out.push({name:nameOf(p),color:SHIRTS[(pr.j|0)%SHIRTS.length],cards:HOLES.map((_,i)=>typeof c[i]==="number"?clamp(c[i]|0,1,20):null),hole:pr.st==="round"?-1:(pr.h|0),live:pr.s|0});}
  return out;

function renderCard(){
  const P=cardPlayers(),curHole=me.st==="round"?-1:me.hole,html=[];
  const sum=(cards,a,b)=>{let t=0,any=false;for(let i=a;i<b;i++)if(cards[i]!=null){t+=cards[i];any=true;}return any?t:"";};
  const parSum=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=HOLES[i].par;return t;};
  [[0,9,"OUT"],[9,18,"IN"]].forEach(([a,b,lab],half)=>{
    const top=half?" half2":" top";
    html.push(`<div class="hd nm${top}">${half?"후반":"전반"}</div>`);
    for(let i=a;i<b;i++)html.push(`<div class="hd${top}${i===curHole?" cur":""}">${i+1}<small>파${HOLES[i].par}</small></div>`);
    html.push(`<div class="hd sum${top}">${lab}<small>${parSum(a,b)}</small></div>`);
    html.push(`<div class="hd sum${top}">${half?"합계":""}<small>${half?parSum(0,18):""}</small></div>`);
    for(const pl of P){
      html.push(`<div class="nm"><span class="dot" style="background:${pl.color}"></span>${esc(pl.name)}</div>`);
      for(let i=a;i<b;i++){const v=pl.cards[i],par=HOLES[i].par,cur=i===curHole?" cur":"";
        if(v!=null)html.push(`<div class="${v<par?"u":v>par?"o":""}${cur}">${v}</div>`);
        else if(i===pl.hole&&pl.live)html.push(`<div class="live${cur}">·${pl.live}</div>`);
        else html.push(`<div class="${cur.trim()}"></div>`);}
      html.push(`<div class="sum">${sum(pl.cards,a,b)}</div>`);
      let tot="";if(half){const t=sum(pl.cards,0,18);if(t!==""){let pp=0;pl.cards.forEach((v,i)=>{if(v!=null)pp+=HOLES[i].par;});const r=t-pp;tot=`${t}`;}}
      html.push(`<div class="sum">${tot}</div>`);
    }
  });
  cardEl.innerHTML=html.join("");
}

// how the green falls, relative to where the camera is looking
function greenRead(){
  const h=H(),g=h.green;if(!(["green","fringe"].includes(ballLie())||dist(me.x,me.y,g[0],g[1])<60))return"";
  const sl=h.slope,m=Math.hypot(...sl),a=Math.atan2(sl[1],sl[0])-camYaw,f=Math.cos(a),r=Math.sin(a);
  const side=r>.35?"오른쪽":r<-.35?"왼쪽":"",along=f>.35?"내리막":f<-.35?"오르막":"";
  const deg=(a*180/Math.PI+90).toFixed(0),strength=m<.2?"약":m<.3?"중":"강";
  return`경사 <span class="wind" style="transform:rotate(${deg}deg)">↑</span> ${[along,side].filter(Boolean).join("·")||"평평"} (${strength})`;
}
function renderHud(){
  const h=H(),ws=Math.hypot(wind.x,wind.y);
  // wind arrow relative to where the camera looks, so "↑" means a following wind
  const wa=(Math.atan2(wind.y,wind.x)-camYaw)*180/Math.PI+90;
  const lie=ballLie();
  const tl=totalLine().replace(" · 합계 ","");
  const pd=pinDist(),gr=greenRead(),bf=buffText();

    `핀 <span class="hi">${pd.toFixed(pd<20?1:0)}m</span> · ${LIE_NAME[lie]||lie} · 바람 ${ws<.5?"없음":`<span class="wind" style="transform:rotate(${wa.toFixed(0)}deg)">↑</span>${ws.toFixed(1)}`}`+
    (gr?`<br>${gr}`:"")+(bf?`<br>${bf}`:"");

// =================== caddie: club + aim ===================
function autoClub(){
  const lie=ballLie(),d=pinDist();
  if(lie==="green"){me.club=PUTTER;return;}
  if(lie==="fringe"&&d<25){me.club=PUTTER;return;}
  const L=(LIE[lie]||LIE.rough).d;
  let pick=0;
  for(let i=PUTTER-1;i>=0;i--){if(CLUBS[i].m*L>=d*.98){pick=i;break;}}
  if(lie==="sand"&&pick<SAND_W&&d<80)pick=SAND_W;
  if(lie!=="tee"&&pick===DRIVER)pick=1;
  me.club=pick;
}
function autoAim(){
  const h=H(),c=CLUBS[me.club],L=(LIE[ballLie()]||LIE.rough).d,reach=c.put?99:c.m*L;
  let tx=h.pin[0],ty=h.pin[1];
  if(pinDist()>reach*1.02){
    let bi=0,bd=1e9;h.samp.forEach((p,i)=>{const d=dist(ball.x,ball.y,p[0],p[1]);if(d<bd){bd=d;bi=i;}});
    for(let i=bi;i<h.samp.length;i++){const p=h.samp[i];if(dist(ball.x,ball.y,p[0],p[1])>=reach*.95){tx=p[0];ty=p[1];break;}}
  }
  me.aim=Math.atan2(ty-ball.y,tx-ball.x);me.face=me.aim+Math.PI/2;
}
// a right-handed golfer stands beside the ball, facing it, with the target on their left
// stand so the clubhead rests on the turf just behind the ball (on the side away from the target)
function addrOffset(len){const x=len-.84;return{r:.74*len+.2384+.1386*x-.1016*x*x,back:.16};}
function addressPos(){const f=me.aim+Math.PI/2,o=addrOffset(CLUBS[me.club].len);return{x:ball.x-Math.cos(f)*o.r-Math.cos(me.aim)*o.back,y:ball.y-Math.sin(f)*o.r-Math.sin(me.aim)*o.back};}
function enterAim(){

function stepBall(dt){
  if(ball.mode==="fly"){
    const s=shot;

    ball.x+=(ball.vx+wind.x*wk*.9)*dt;ball.y+=(ball.vy+wind.y*wk*.9)*dt;
    const tg=terrainAt(ball.x,ball.y);if(tg!=="water"&&tg!=="ob")s.lastLand={x:ball.x,y:ball.y};
    if(dist(ball.x,ball.y,s.start.x,s.start.y)>6){
      for(const t of treesNear(ball.x,ball.y)){
        if(s.hitTrees.has(t)||ball.z>t.h)continue;
        if(dist(ball.x,ball.y,t.x,t.y)<t.r*.85){
          s.hitTrees.add(t);s.treeHit=true;sfx.tree();
          const a=Math.random()*TAU,sp=2+Math.random()*4;ball.vx=Math.cos(a)*sp;ball.vy=Math.sin(a)*sp;ball.vz=Math.min(ball.vz,0)*.3;
          addPop(t.x,t.y,"나무 맞았어요",false);break;
        }
      }
    }
    if(ball.z<=0){
      ball.z=0;
      if(tg!=="ob")spawnDebris(ball.x,ball.y,tg,Math.atan2(ball.vy,ball.vx),false);
      if(tg==="ob"){penalty("ob");return;}
      if(tg==="water"){penalty("water");return;}
      if(dist(ball.x,ball.y,...H().pin)<.45){holed();return;}
      if(tg==="sand"){sfx.sand();rest();return;}
      sfx.land(tg);
      const hs=Math.hypot(ball.vx,ball.vy)||1;
      let v=Math.sqrt(2*6.5*s.carry*s.club.roll);
      if(tg==="green")v*=.55;if(tg==="rough")v*=.45;if(s.treeHit)v*=.3;
      ball.vx=ball.vx/hs*v;ball.vy=ball.vy/hs*v;ball.mode="roll";me.st="roll";shot.lipped=false;
    }
  }else if(ball.mode==="roll"){
    const tg=terrainAt(ball.x,ball.y);
    if(tg==="water"){penalty("water");return;}
    if(tg==="ob"){penalty("ob");return;}
    let sp=Math.hypot(ball.vx,ball.vy);
    const fr=(ROLL_FRIC[tg]||20)*dt;
    if(sp<=fr){ball.vx=ball.vy=0;sp=0;}else{ball.vx-=ball.vx/sp*fr;ball.vy-=ball.vy/sp*fr;}
    if(tg==="green"){const sl=H().slope;ball.vx+=sl[0]*dt;ball.vy+=sl[1]*dt;}
    if(shot)shot.lastLand={x:ball.x,y:ball.y};
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    sp=Math.hypot(ball.vx,ball.vy);
    const pd=dist(ball.x,ball.y,...H().pin);

      shot.lipped=true;const a=(Math.random()<.5?1:-1)*(.35+Math.random()*.3),c=Math.cos(a),s=Math.sin(a);
      const nx=ball.vx*c-ball.vy*s,ny=ball.vx*s+ball.vy*c;ball.vx=nx*.7;ball.vy=ny*.7;
      addPop(ball.x,ball.y,"아, 돌아 나왔어요",false);sfx.lip();
    }
    if(shot&&shot.lipped&&pd>.8)shot.lipped=false;
    if(sp<.05){
      const slope=tg==="green"?Math.hypot(...H().slope):0;
      if(slope<(ROLL_FRIC[tg]||20)*.9)rest();
    }
  }
}

  let lx=b.bx+Math.cos(dir)*carry+wind.x*T*.5,ly=b.by+Math.sin(dir)*carry+wind.y*T*.5;
  const lt=terrainAt(lx,ly);
  if(lt==="water"||lt==="ob"){
    // drop: back along the line to dry ground (water) or replay from where it was hit (OB)
    let rx=b.bx,ry=b.by;
    if(lt==="water"){const dx=b.bx-lx,dy=b.by-ly,dl=Math.hypot(dx,dy)||1;rx=lx;ry=ly;for(let k=0;k<80&&terrainAt(rx,ry)==="water";k++){rx+=dx/dl*2;ry+=dy/dl*2;}rx+=dx/dl*2;ry+=dy/dl*2;}
    return{club:ci,sx:b.bx,sy:b.by,lx,ly,ex:rx,ey:ry,T,h:c.h*.9,rollT:0,pen:1,why:lt};
  }
  const rk=lt==="fairway"||lt==="tee"?1:lt==="green"||lt==="fringe"?.5:lt==="rough"?.3:0;
  let roll=carry*(c.roll||.04)*rk,ex=lx+Math.cos(dir)*roll,ey=ly+Math.sin(dir)*roll;
  for(let k=0;k<20&&(terrainAt(ex,ey)==="water"||terrainAt(ex,ey)==="ob");k++){roll*=.75;ex=lx+Math.cos(dir)*roll;ey=ly+Math.sin(dir)*roll;}
  if(terrainAt(ex,ey)==="water"||terrainAt(ex,ey)==="ob"){ex=lx;ey=ly;}
  const holed=dist(ex,ey,...pin)<.35;
  return{club:ci,sx:b.bx,sy:b.by,lx,ly,ex,ey,T,h:c.h*.9,rollT:roll>.5?.6+roll*.04:0,pen:0,holed};
}
function botVol(b){return clamp(1-dist(cam.position.x,cam.position.z,b.bx,b.by)/160,.06,.45);}
function botHit(b){
  const pl=b.plan||botPlan(b);b.plan=null;b.anim={...pl,t:-SWING_DOWN};b.strokes++;b.st="shot";b.ht=Date.now();b.g=-1;
  b.fx=()=>{if(!pl.putt)spawnDebris(pl.sx,pl.sy,terrainAt(pl.sx,pl.sy),Math.atan2((pl.ly??pl.ey)-pl.sy,(pl.lx??pl.ex)-pl.sx),true,CLUBS[pl.club].t);
  if(soundOn&&AC){const v=botVol(b);if(pl.putt)play(pick(["putt_1","putt_2","putt_3","putt_4"]),v);else if(LONG(CLUBS[pl.club].t))play(pick(["hit_driver_1","hit_driver_2","hit_driver_3"]),v);else play("hit_iron_2",v*.85);}};
}
function botFinishShot(b){
  const a=b.anim;b.anim=null;b.bx=a.ex;b.by=a.ey;b.bz=0;
  const h=H();
  if(a.pen){b.strokes++;addPop(a.lx,a.ly,a.why==="water"?`${b.name} 풍덩`:`${b.name} OB`,false);if(soundOn&&AC&&a.why==="water")play(pick(["splash_1","splash_2"]),botVol(b));}

function botHoleOut(b,score,pickedUp){

  if(!pickedUp)try{sfx.crowd(score,h.par,true);}catch(e){}

  const side=botIdx(b)?1:-1,g=h.green;b.tgt={x:g[0]+Math.cos(g[4]+Math.PI/2)*(g[3]+5)*side,y:g[1]+Math.sin(g[4]+Math.PI/2)*(g[3]+5)*side};

function anyBallMoving(){return me.st==="down"||ball.mode==="fly"||ball.mode==="roll"||bots.some(b=>b.st==="shot");}
function stepBots(dt,t){
  const now=performance.now();
  if(bots.length&&bots[0].hole!==me.hole&&me.st!=="done")botsNextHole();
  // one player at a time: the bot furthest from the pin goes first, and nobody hits while a ball is moving
  let next=null;
  if(me.st!=="round"&&!anyBallMoving()&&me.st!=="swing"&&!bots.some(b=>b.st==="addr")){
    const pin=H().pin;
    for(const b of bots)if(b.st==="ready"&&now-b.t0>1600&&(!next||dist(b.bx,b.by,...pin)>dist(next.bx,next.by,...pin)))next=b;
  }
  if(next){next.st="addr";next.t0=now;}
  for(const b of bots){
    b.walking=false;
    if(b.st==="walk"&&b.tgt){
      const dx=b.tgt.x-b.x,dy=b.tgt.y-b.y,l=Math.hypot(dx,dy),sp=Math.min(l,(l>40?14:7)*dt);
      if(l<.3){b.x=b.tgt.x;b.y=b.tgt.y;b.tgt=null;if(!b.holed){b.st="ready";b.t0=now;b.f=b.aim+Math.PI/2;}else b.st="wait";}
      else{b.x+=dx/l*sp;b.y+=dy/l*sp;b.f=Math.atan2(dy,dx);b.walking=true;}
    }
    if(b.st==="ready"){b.f=b.aim+Math.PI/2;}
    if(b.st==="addr"&&!b.plan){b.plan=botPlan(b);const c=CLUBS[b.plan.club];setClubLook(b.G,c.t,c.len);b.clubLen=c.len;}
    if(b.st==="addr"){const k=(now-b.t0)/1000;b.g=Math.min(1,k/1.1);if(k>1.7)botHit(b);}
    if(b.st==="shot"&&b.anim){
      const a=b.anim;a.t+=dt;if(a.t>=0&&b.fx){b.fx();b.fx=null;}
      if(a.t<0){poseGolfer(b.G,{put:!!a.putt,x:b.x,y:b.y,f:b.f,w:false,addr:true,g:-1,ht:b.ht,P:.95},t);b.mesh.position.set(b.bx,groundH(b.bx,b.by)+.11,b.by);continue;}
      if(a.putt){const k=Math.min(1,a.t/a.T),e=1-(1-k)*(1-k);b.bx=a.sx+(a.ex-a.sx)*e;b.by=a.sy+(a.ey-a.sy)*e;b.bz=0;if(k>=1)botFinishShot(b);}
      else if(a.t<a.T){const k=a.t/a.T;b.bx=a.sx+(a.lx-a.sx)*k;b.by=a.sy+(a.ly-a.sy)*k;b.bz=4*a.h*k*(1-k);}
      else if(!a.pen&&a.t<a.T+a.rollT){const k=(a.t-a.T)/a.rollT,e=1-(1-k)*(1-k);b.bx=a.lx+(a.ex-a.lx)*e;b.by=a.ly+(a.ey-a.ly)*e;b.bz=0;}
      else botFinishShot(b);
    }
    const addr=b.st==="addr"||(b.st==="shot"&&Date.now()-b.ht<1900)||(b.st!=="walk"&&!b.holed&&Date.now()-b.ht<1900);
    poseGolfer(b.G,{put:b.plan?!!b.plan.putt:b.anim?!!b.anim.putt:false,x:b.x,y:b.y,f:b.f,w:b.walking,addr,g:b.st==="addr"?b.g:-1,ht:b.ht,idle:b.st==="ready"||b.st==="wait"?2:0},t);
    b.mesh.visible=!(b.holed&&b.st!=="shot");
    // step out of the shot when they wander right in front of the camera
    b.G.root.visible=Math.hypot(cam.position.x-b.x,cam.position.z-b.y)>3.4;
    b.mesh.position.set(b.bx,groundH(b.bx,b.by)+.11+b.bz,b.by);b.mesh.scale.setScalar(clamp(cam.position.distanceTo(b.mesh.position)/18,1,6));
  }
}
